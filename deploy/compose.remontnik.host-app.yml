# Добавка к compose.remontnik.yml для приложения в сети сервера (network_mode: host).
# Такое приложение не подключается к сетям Docker, поэтому сторож ходит к врачу через 127.0.0.1 сервера:
#   docker compose -f deploy/compose.remontnik.yml -f deploy/compose.remontnik.host-app.yml up -d --build
#
# Переменные — как в шапке compose.remontnik.yml, с двумя отличиями:
#   REMONTNIK_APP_NETWORK  сеть приёма. Её создаёт сам Ремонтник (например remontnik-intake), в ней только врач.
#   REMONTNIK_HOST_PORT    порт приёма на 127.0.0.1 сервера (по умолчанию 7800).
# У сторожа приложения REMONTNIK_DOCTOR_URL=http://127.0.0.1:<REMONTNIK_HOST_PORT>.
#
# Как закрыт приём. Порт опубликован только на 127.0.0.1: снаружи сервера его нет, а 127.0.0.1 контейнера —
# это сам контейнер, не сервер. Врач по-прежнему слушает только свой адрес в сети приёма. В ней нет ни
# браузера, ни контейнеров случая, а соседние сети Docker друг друга не видят.
# Docker ведёт опубликованный порт в ту сеть контейнера, через которую идёт его выход наружу. Поэтому у сети
# приёма gw_priority выше, чем у outside: без этого порт вёл бы в outside, где врач не слушает.
# Выход врача к моделям, реестру и Telegram тоже идёт через сеть приёма. Нужен Docker 28 или новее.

services:
  doctor:
    ports:
      - 127.0.0.1:${REMONTNIK_HOST_PORT:-7800}:7800
    networks:
      app:
        gw_priority: 1

networks:
  app:
    external: false
